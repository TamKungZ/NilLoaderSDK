plugins {
    id 'java'
	id 'com.unascribed.nilgradle' version '1.4.4'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
}

group = 'me.tamkungz.nilloadersdk'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    if (options.hasProperty('addStringOption')) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    failOnError = false
}

nil {
    id 'nilloadersdk'
    standalone true
}

configurations {
    deps
    cfr
}

repositories {
    mavenCentral()
    maven { url 'https://repo.sleeping.town' }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    cfr 'org.benf:cfr:0.152'

    game nil.minecraft('1.4.7', 'client')
    jarmod nil.minecraft('1.4.7', 'server')

    compileOnly 'com.unascribed:nilloader:1.3.6'
    deps 'com.unascribed:nilloader:1.3.6'

    implementation 'org.ow2.asm:asm:9.5'
    implementation 'org.ow2.asm:asm-tree:9.5'

    // shadow 'org.spongepowered:mixin:0.8.5'
}

task fetchDeps(type: Copy) {
    from configurations.deps
    into "$buildDir/deps"
}

task decompileNilloader(type: JavaExec) {
    dependsOn 'fetchDeps'

    doFirst {
        def nilJar = fileTree("$buildDir/deps").matching {
            include "*nilloader*.jar"
        }.singleFile

        args = [
                nilJar.absolutePath,
                '--outputdir', "$buildDir/decompiled"
        ]
    }

    classpath = configurations.cfr
    mainClass = 'org.benf.cfr.reader.Main'
}

build.dependsOn decompileNilloader

jar {
    from {
        configurations.shadow.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes(
            'NilModID': 'nilloadersdk',
            'NilModName': 'NilLoaderSDK'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'nilloadersdk'

            pom {
                name = 'NilLoaderSDK'
                description = 'SDK for NilLoader-based Minecraft mods'
                url = 'https://github.com/exaskye/NilLoader'

                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3.0 or later'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.txt'
                        distribution = 'repo'
                    }
                }

                scm {
                    url = 'https://git.sleeping.town/Nil/NilLoader'
                }
            }
        }
    }

    repositories {
        mavenLocal()

        def repoUrl = findProperty('mavenRepoUrl') ?: System.getenv('MAVEN_REPO_URL')
        if (repoUrl) {
            maven {
                url = uri(repoUrl)
                credentials {
                    username = findProperty('mavenRepoUser') ?: System.getenv('MAVEN_REPO_USER')
                    password = findProperty('mavenRepoPassword') ?: System.getenv('MAVEN_REPO_PASSWORD')
                }
            }
        }
    }
}
