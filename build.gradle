plugins {
    id 'java'
	id 'com.unascribed.nilgradle' version '1.4.4'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
}

group = 'me.tamkungz.nilloadersdk'
version = '2.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    if (options.hasProperty('addStringOption')) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    failOnError = false
}

nil {
    id 'nilloadersdk'
    standalone true
}

configurations {
    deps
    cfr
}

repositories {
    mavenCentral()
    maven { url 'https://repo.sleeping.town' }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    cfr 'org.benf:cfr:0.152'

    game nil.minecraft('1.4.7', 'client')
    jarmod nil.minecraft('1.4.7', 'server')

    compileOnly 'com.unascribed:nilloader:1.3.6'
    deps 'com.unascribed:nilloader:1.3.6'

    implementation 'org.ow2.asm:asm:9.5'
    implementation 'org.ow2.asm:asm-tree:9.5'
    
    // shadow 'org.spongepowered:mixin:0.8.5'
}

task fetchDeps(type: Copy) {
    from configurations.deps
    into "$buildDir/deps"
}

task decompileNilloader(type: JavaExec) {
    dependsOn 'fetchDeps'

    doFirst {
        def nilJar = fileTree("$buildDir/deps").matching {
            include "*nilloader*.jar"
        }.singleFile

        args = [
                nilJar.absolutePath,
                '--outputdir', "$buildDir/decompiled"
        ]
    }

    classpath = configurations.cfr
    mainClass = 'org.benf.cfr.reader.Main'
}

build.dependsOn decompileNilloader

def generatedRemapJavaDir = "$buildDir/generated/sources/remapping/main"
def generatedBuildInfoJavaDir = "$buildDir/generated/sources/buildinfo/main"

task generateModBuildInfoFallback {
    outputs.file "$generatedBuildInfoJavaDir/me/tamkungz/nilloadersdk/build/ModBuildInfo.java"

    doLast {
        def sourceBuildInfo = file('src/main/java/me/tamkungz/nilloadersdk/build/ModBuildInfo.java')
        if (sourceBuildInfo.exists()) {
            return
        }

        def out = file("$generatedBuildInfoJavaDir/me/tamkungz/nilloadersdk/build/ModBuildInfo.java")
        out.parentFile.mkdirs()
        out.setText('''package me.tamkungz.nilloadersdk.build;

public final class ModBuildInfo {
    private final String buildTag;

    public ModBuildInfo(String buildTag) {
        this.buildTag = (buildTag == null || buildTag.trim().isEmpty()) ? "unknown-build" : buildTag.trim();
    }

    public String getBuildTag() {
        return buildTag;
    }
}
''', 'UTF-8')
    }
}

task generateSimpleRemapMappings {
    inputs.dir '.remapping'
    inputs.files fileTree('src/main/java') { include '**/*.java' }
    outputs.file "$generatedRemapJavaDir/me/tamkungz/remapping/GeneratedSrgMappings.java"

    doLast {
        def fieldNeed = new LinkedHashSet<String>()
        def methodNeed = new LinkedHashSet<String>()
        def classNeed = new LinkedHashSet<String>()

        fileTree('src/main/java').matching { include '**/*.java' }.each { f ->
            String txt = f.getText('UTF-8')

            def fm = (txt =~ /remap\.field\(\s*"([^"]+)"\s*,\s*"([^"]+)"\s*\)/)
            fm.each { m -> fieldNeed.add("${m[1]}.${m[2]}") }

            def mm = (txt =~ /remap\.method\(\s*"([^"]+)"\s*,\s*"([^"]+)"\s*\)/)
            mm.each { m -> methodNeed.add("${m[1]}.${m[2]}") }

            def cm = (txt =~ /remap\.cls\(\s*"([^"]+)"\s*\)/)
            cm.each { m -> classNeed.add("${m[1]}") }
        }

        def versionData = new LinkedHashMap<String, Map<String, Map<String, String>>>()
        def root = file('.remapping')
        if (root.exists()) {
            root.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> a.name <=> b.name }?.each { vd ->
                def srg = new File(vd, 'mcp2obf.srg')
                if (!srg.exists()) return

                def classes = new LinkedHashMap<String, String>()
                def fields = new LinkedHashMap<String, String>()
                def methods = new LinkedHashMap<String, String>()

                srg.eachLine('UTF-8') { raw ->
                    String line = raw.trim()
                    if (line.isEmpty() || line.startsWith('#')) return

                    if (line.startsWith('CL: ')) {
                        String[] p = line.substring(4).trim().split(/\s+/)
                        if (p.length >= 2) {
                            String friendly = p[0]
                            int idx = friendly.lastIndexOf('/')
                            friendly = idx >= 0 ? friendly.substring(idx + 1) : friendly
                            if (classNeed.contains(friendly) && !classes.containsKey(friendly)) {
                                String obf = p[1]
                                if (obf.indexOf('/') >= 0) obf = obf.replace('/', '.')
                                classes.put(friendly, obf)
                            }
                        }
                    } else if (line.startsWith('FD: ')) {
                        String[] p = line.substring(4).trim().split(/\s+/)
                        if (p.length >= 2) {
                            int i1 = p[0].lastIndexOf('/')
                            int i2 = p[1].lastIndexOf('/')
                            if (i1 > 0 && i2 > 0 && i1 < p[0].length() - 1 && i2 < p[1].length() - 1) {
                                String leftOwner = p[0].substring(0, i1)
                                String leftName = p[0].substring(i1 + 1)
                                String rightName = p[1].substring(i2 + 1)

                                int cidx = leftOwner.lastIndexOf('/')
                                String simpleOwner = cidx >= 0 ? leftOwner.substring(cidx + 1) : leftOwner
                                String key = simpleOwner + '.' + leftName
                                if (fieldNeed.contains(key) && !fields.containsKey(key)) {
                                    fields.put(key, rightName)
                                }
                            }
                        }
                    } else if (line.startsWith('MD: ')) {
                        String[] p = line.substring(4).trim().split(/\s+/)
                        if (p.length >= 4) {
                            int i1 = p[0].lastIndexOf('/')
                            int i2 = p[2].lastIndexOf('/')
                            if (i1 > 0 && i2 > 0 && i1 < p[0].length() - 1 && i2 < p[2].length() - 1) {
                                String leftOwner = p[0].substring(0, i1)
                                String leftName = p[0].substring(i1 + 1)
                                String rightName = p[2].substring(i2 + 1)

                                int cidx = leftOwner.lastIndexOf('/')
                                String simpleOwner = cidx >= 0 ? leftOwner.substring(cidx + 1) : leftOwner
                                String key = simpleOwner + '.' + leftName
                                if (methodNeed.contains(key) && !methods.containsKey(key)) {
                                    methods.put(key, rightName)
                                }
                            }
                        }
                    }
                }

                if (!classes.isEmpty() || !fields.isEmpty() || !methods.isEmpty()) {
                    versionData.put(vd.name, [classes: classes, fields: fields, methods: methods])
                }
            }
        }

        def esc = { String s ->
            s.replace('\\', '\\\\').replace('"', '\\"')
        }

        def out = new File("$generatedRemapJavaDir/me/tamkungz/remapping/GeneratedSrgMappings.java")
        out.parentFile.mkdirs()

        StringBuilder sb = new StringBuilder()
        sb.append('package me.tamkungz.remapping;\n\n')
        sb.append('/** Auto-generated by Gradle task generateSimpleRemapMappings. */\n')
        sb.append('public final class GeneratedSrgMappings {\n')
        sb.append('    private GeneratedSrgMappings() {}\n\n')
        sb.append('    public static boolean apply(String version, SimpleRemap r, boolean overwriteExisting) {\n')
        sb.append('        if (version == null) return false;\n')
        sb.append('        switch (version) {\n')

        versionData.each { ver, maps ->
            sb.append('            case "').append(esc(ver)).append('":\n')
            maps.classes.entrySet().sort { a, b -> a.key <=> b.key }.each { e ->
                sb.append('                r.addClass("').append(esc(e.key)).append('", "').append(esc(e.value)).append('", overwriteExisting);\n')
            }
            maps.fields.entrySet().sort { a, b -> a.key <=> b.key }.each { e ->
                int idx = e.key.indexOf('.')
                String cls = e.key.substring(0, idx)
                String name = e.key.substring(idx + 1)
                sb.append('                r.addField("').append(esc(cls)).append('", "').append(esc(name)).append('", "').append(esc(e.value)).append('", overwriteExisting);\n')
            }
            maps.methods.entrySet().sort { a, b -> a.key <=> b.key }.each { e ->
                int idx = e.key.indexOf('.')
                String cls = e.key.substring(0, idx)
                String name = e.key.substring(idx + 1)
                sb.append('                r.addMethod("').append(esc(cls)).append('", "').append(esc(name)).append('", "').append(esc(e.value)).append('", overwriteExisting);\n')
            }
            sb.append('                return true;\n')
        }

        sb.append('            default:\n')
        sb.append('                return false;\n')
        sb.append('        }\n')
        sb.append('    }\n')
        sb.append('}\n')

        out.setText(sb.toString(), 'UTF-8')
    }
}

sourceSets {
    main {
        java {
            srcDir generatedRemapJavaDir
            srcDir generatedBuildInfoJavaDir
        }
    }
}

compileJava.dependsOn generateSimpleRemapMappings
compileJava.dependsOn generateModBuildInfoFallback
tasks.named('sourcesJar') {
    dependsOn generateSimpleRemapMappings
    dependsOn generateModBuildInfoFallback
}

jar {
    from {
        configurations.shadow.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes(
            'NilModID': 'nilloadersdk',
            'NilModName': 'NilLoaderSDK'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'nilloadersdk'

            pom {
                name = 'NilLoaderSDK'
                description = 'SDK for NilLoader-based Minecraft mods'
                url = 'https://github.com/TamKungZ/NilLoaderSDK'

                licenses {
                    license {
                        name = 'GNU Lesser General Public License v3.0 or later'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.txt'
                        distribution = 'repo'
                    }
                }

                scm {
                    url = 'https://github.com/TamKungZ/NilLoaderSDK.git'
                }
            }
        }
    }

    repositories {
        mavenLocal()

        def repoUrl = findProperty('mavenRepoUrl') ?: System.getenv('MAVEN_REPO_URL')
        if (repoUrl) {
            maven {
                url = uri(repoUrl)
                credentials {
                    username = findProperty('mavenRepoUser') ?: System.getenv('MAVEN_REPO_USER')
                    password = findProperty('mavenRepoPassword') ?: System.getenv('MAVEN_REPO_PASSWORD')
                }
            }
        }
    }
}
