name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify release tag
        run: python scripts/verify_release_tag.py "${GITHUB_REF_NAME}"

      - name: Build and test
        run: ./gradlew --no-daemon clean build test

      - name: Extract CHANGE.md section
        run: python scripts/extract_changelog.py "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: Create checksums
        shell: bash
        run: |
          cd build/libs
          sha256sum *.jar > ../../SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            build/libs/*.jar
            SHA256SUMS.txt
          fail_on_unmatched_files: true
