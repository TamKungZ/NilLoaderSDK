# NilKit shared entrypoint routing
#
# Specify the mod entrypoint classes used by the SDK (must implement Runnable).
# Multiple classes can be separated by commas.
#
# Example:
# premain=com.example.mod.MyPremain
# hijack=com.example.mod.MyHijack
#
# Note:
# Do NOT point premain/hijack to:
# me.tamkungz.nilkit.entrypoint.NilKitPremain or
# me.tamkungz.nilkit.entrypoint.NilKitHijack
# as this will cause recursive invocation (infinite loop).

premain=
hijack=